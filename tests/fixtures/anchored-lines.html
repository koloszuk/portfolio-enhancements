<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Anchored lines geometry fixture</title>
<link rel="stylesheet" href="../../css/decorations/anchored-lines.css">
<link rel="stylesheet" href="../../css/backgrounds/dot-grid.css">
<style>
body{margin:0;font:18px system-ui} .controls{position:fixed;top:0;right:0;z-index:20;background:white;padding:10px}
.page{position:relative;isolation:isolate;padding-top:100px}.page-content{position:relative;isolation:isolate;height:2400px}
.intro{position:absolute;top:60px;left:15%;width:15%}.projects-scribble{position:absolute;top:140px;left:30%}
dotlottie-wc{display:block;width:55px;height:22px;background:#888}.back{position:absolute;left:70%;bottom:80px}
.projects{position:absolute;top:400px;left:10%;right:10%;height:1200px;display:grid;grid-template-columns:1fr 1fr;gap:100px}
.project{height:300px;background:#d89b65}.project:nth-child(even){background:#8aadc9;margin-top:160px}
</style>
<div class="controls"><button id="intro">Move intro</button><button id="footer">Move footer</button><button id="grow">Add content</button><button id="target">Move target</button></div>
<div id="L3482832595" class="page"><div class="dan-background-layer" data-grid="true" style="--dan-grid-spacing:36px;--dan-grid-dot-size:2px"></div>
<div class="page-content"><div class="intro" data-dan-line-anchor="intro">Intro text</div><div class="projects-scribble"><dotlottie-wc></dotlottie-wc></div>
<div class="projects"><gallery-freeform thumbnail-index="fixture"><media-item href="#project-08-logitech" style="display:block;width:100%;height:300px"><div></div></media-item></gallery-freeform><div class="project"></div><div class="project"></div><div class="project"></div></div>
<a class="back" data-dan-line-anchor="back-to-top" href="#" rel="home-page">Back to Top</a></div></div>
<script type="module">
import {mountAnchoredLines} from '../../js/decorations/anchored-lines.js';
customElements.define('media-item', class extends HTMLElement {
  constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<figure part="figure" style="margin:0;height:300px;background:#d89b65">Logitech target</figure>';}
});
mountAnchoredLines();
document.querySelector('#intro').onclick=()=>{document.querySelector('.intro').style.left='20%';};
document.querySelector('#footer').onclick=()=>{document.querySelector('.back').style.left='55%';};
document.querySelector('#target').onclick=()=>{document.querySelector('media-item').style.marginTop='180px';};
document.querySelector('#grow').onclick=()=>{const e=document.querySelector('.page-content');e.style.height=`${e.clientHeight+600}px`;};
</script></html>
